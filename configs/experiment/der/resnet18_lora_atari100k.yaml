# @package _global_
# DER with an ImageNet-pretrained ResNet-18 encoder and LoRA adapters.
defaults:
  - /experiment/der/atari100k
  - _self_

algorithm:
  encoder_type: resnet18
  resnet18_weights: DEFAULT
  resnet18_variant: resnet_layer3
  transfer_mode: lora
  lora_rank: 1
  lora_alpha: 2.0
  lora_dropout: 0.0
  encoder_lr: 1.0e-4
  adapter_lr: 1.0e-4
  freeze_encoder_bn: true
