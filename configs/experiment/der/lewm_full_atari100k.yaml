# @package _global_
# DER with a LeWM PushT ViT-Tiny/14 encoder, full fine-tuning from block 7 features.
defaults:
  - /experiment/der/atari100k
  - _self_

algorithm:
  encoder_type: lewm_vit_tiny14
  lewm_weights: models/lewm_pusht_weights.pt
  lewm_output_block: 7
  transfer_mode: full_finetune
  encoder_lr: 1.0e-6
  adapter_lr: 1.0e-4
