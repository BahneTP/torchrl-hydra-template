# @package _global_
# DER with a LeWM PushT ViT-Tiny/14 encoder, linear probing from block 7 features.
defaults:
  - /experiment/der/atari100k
  - _self_

algorithm:
  encoder_type: lewm_vit_tiny14
  lewm_weights: models/lewm_pusht_weights.pt
  lewm_output_block: 7
  transfer_mode: linear_probe
  encoder_lr: 0.0
  adapter_lr: 1.0e-4
