# @package _global_
defaults:
  - override /algorithm: der
  - override /environment: atari100k_train
  - override /environment@eval_environment: atari100k_eval
  - override /logger: wandb
  - _self_

atari:
  game: Jamesbond

# Override W&B run name: default wandb.yaml uses hydra env choice
# (atari100k_train); pin the game id instead.
logger:
  - _target_: src.callbacks.logger.WandBLogger
    project: torchrl-hydra-template
    entity: null
    name: der_atari_jamesbond_${now:%Y-%m-%d_%H-%M-%S}
    tags: []
    mode: online
    save_dir: ${paths.log_dir}/wandb/

trainer:
  total_frames: 100_000
  seed: 1
  accelerator: gpu
  devices: [0]
  num_envs: 1
  log_every_n_steps: 1_000
