# @package _global_
# DER with an ImageNet-pretrained ResNet-18 encoder and attentive probing.
defaults:
  - /experiment/der/atari100k
  - _self_

algorithm:
  encoder_type: resnet18
  resnet18_weights: DEFAULT
  resnet18_variant: resnet_layer3
  transfer_mode: attentive_probe
  encoder_lr: 0.0
  adapter_lr: 1.0e-4
  freeze_encoder_bn: true
