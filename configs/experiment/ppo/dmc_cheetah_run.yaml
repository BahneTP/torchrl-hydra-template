# @package _global_
# PPO on DMC cheetah-run at 1M frames — cleanRL ppo_continuous_action.py
# hyperparameters (https://docs.cleanrl.dev/rl-algorithms/ppo/) on the
# DeepMind Control Suite task via the dm_control backend.
# All algorithm hyperparameters live in configs/algorithm/ppo.yaml;
# only trainer-side settings are overridden here.
defaults:
  - override /algorithm: ppo
  - override /environment: dmc_cheetah_run_ppo
  - override /logger: wandb
  - _self_

# trainer/default.yaml already provides cpu / 1M frames / 1 env / seed 42;
# algorithm.anneal_frames follows trainer.total_frames automatically.
