# @package _global_
# DreamerV3 on Atari-100k. Swap the world model with `algorithm=r2dreamer` or
# `algorithm=dreamerpro`, and the model size with `+algorithm/dreamer=50m`.
# Run another game with: environment.task=Breakout
defaults:
  - /algorithm/dreamer: 200m
  - override /algorithm: dreamer
  - override /environment: atari100k
  - override /evaluation: none
  - override /trainer: gpu
  - override /logger: wandb
  - _self_

environment:
  task: Hero
  # DreamerV3 preprocessing differs from the shared Atari-100k stack: 64x64
  # RGB frames (no grayscale, no frame stack — the RSSM carries history) and
  # `is_first` / `image` key names.
  gym_kwargs:
    frame_skip: 1                   # required by AtariPreprocessing
    repeat_action_probability: 0.0
    full_action_space: false        # minimal action set
    from_pixels: true
    pixels_only: false
    categorical_action_encoding: false
  gymnasium_wrappers:
    - _target_: gymnasium.wrappers.AtariPreprocessing
      noop_max: 30                  # 1-30 raw-frame noops on reset (Atari-100k protocol).
                                    # A NoopResetEnv transform would sit above frame_skip=4
                                    # and produce 4-120 raw frames of noops instead.
      frame_skip: 4                 # action_repeat=4 with max-pool of last 2 frames
      screen_size: 64               # replaces the Resize transform
      grayscale_obs: false          # keep RGB for DreamerV3
      terminal_on_life_loss: false
      scale_obs: false              # keep uint8; ToTensorImage normalises to [0,1]
  transforms:
    - _target_: torchrl.envs.InitTracker
    - _target_: torchrl.envs.RenameTransform
      in_keys: ["is_init"]
      out_keys: ["is_first"]
    - _target_: torchrl.envs.ToTensorImage
    - _target_: torchrl.envs.RenameTransform
      in_keys: ["pixels"]
      out_keys: ["image"]
    - _target_: torchrl.envs.StepCounter
      max_steps: 27000              # 108000 ALE frames / action_repeat=4
    - _target_: torchrl.envs.RewardSum
    - _target_: torchrl.envs.DoubleToFloat

algorithm:
  action_repeat: 4        # AtariPreprocessing(frame_skip=4) above

# DreamerV3 reports training-stream episode returns, and this stack sets
# `terminal_on_life_loss: false` with no reward clipping, so those returns are
# true game scores — separate eval rollouts would add nothing.
# `summary_max_step` reproduces upstream's reporting rule: training runs 10%
# past the Atari-100k budget, but the headline number is cut off at 100k agent
# steps (= 400k game frames).
evaluation:
  summary_max_step: 100_000

run_name: dreamer_${environment.task}_atari100k_${model_size}_${now:%Y-%m-%d_%H-%M-%S}

trainer:
  # 110k agent steps = 440k game frames; official DreamerV3 trains 10% past the
  # 100k budget. `evaluation.summary_max_step` above keeps the headline number
  # cut off at 100k agent steps.
  total_frames: 110_000
  log_every_n_steps: 1_000
