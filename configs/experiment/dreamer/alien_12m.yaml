# @package _global_
defaults:
  - override /algorithm: dreamer
  - override /environment: qbert
  - override /logger: wandb
  - _self_

trainer:
  accelerator: gpu
  devices: [2]
  seed: 42
  total_frames: 4.1e5 # 100k Steps (frame_skip=4)
  num_envs: 1             # number of parallel environments
  log_every_n_steps: 5e3

model:
  deter: 2048
  hidden: 256
  discrete: 16
  depth: 16
  units: 256
  act: 'SiLU'
  norm: True

# TODO: Change this structure in the future
env:
  encoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
  decoder:
    mlp_keys: '$^'
    cnn_keys: 'image'