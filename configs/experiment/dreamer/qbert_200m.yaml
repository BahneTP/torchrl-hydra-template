# @package _global_
defaults:
  - override /algorithm: dreamer
  - override /environment: qbert
  - override /logger: wandb
  - _self_

trainer:
  accelerator: gpu
  devices: [3]
  seed: 42
  total_frames: 1e5 # 100k agent steps = 400k game frames (action_repeat=4)
  num_envs: 1
  log_every_n_steps: 1000

model:
  deter: 8192
  hidden: 1024
  discrete: 64
  depth: 64
  units: 1024
  act: 'SiLU'
  norm: True

env:
  encoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
  decoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
