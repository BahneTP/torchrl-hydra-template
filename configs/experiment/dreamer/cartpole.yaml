# @package _global_
defaults:
  - override /algorithm: dreamer
  - override /environment: cartpole
  - override /logger: wandb
  - _self_

trainer:
  _target_: src.trainers.StatefulTrainer
  accelerator: cpu        # "cpu" | "gpu" | "mps"
  devices: [1]            # GPU indices; ignored when accelerator=cpu
  seed: 42
  total_frames: 30_000
  num_envs: 1             # number of parallel environments
  log_every_n_steps: 1_000

model:
  deter: 2048
  hidden: 256
  discrete: 16
  depth: 16
  units: 256
  act: 'SiLU'
  norm: True

# TODO: Change this structure in the future
env:
  encoder:
    mlp_keys: 'observation'
    cnn_keys: '$^'
  decoder:
    mlp_keys: 'observation'
    cnn_keys: '$^'

environment:
  transforms:
    - _target_: torchrl.envs.transforms.InitTracker
    
    - _target_: torchrl.envs.transforms.RenameTransform
      in_keys: ["is_init"]
      out_keys: ["is_first"]
      
    - _target_: torchrl.envs.transforms.StepCounter
    - _target_: torchrl.envs.transforms.RewardSum