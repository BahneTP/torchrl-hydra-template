# @package _global_
defaults:
  - /algorithm/dreamer: 200m
  - override /algorithm: dreamer
  - override /environment: atari_dreamer
  - override /trainer: gpu
  - override /logger: wandb
  - _self_

env_id: qbert

run_name: dreamer_${env_id}_${environment.benchmark}_${model_size}_${now:%Y-%m-%d_%H-%M-%S}

environment:
  name: ALE/Qbert-v5

trainer:
  # 110k agent steps = 440k game frames; official DreamerV3 trains 10% past the
  # 100k budget (eval/score_* still cuts off at 400k frames).
  total_frames: 110_000
  log_every_n_steps: 1_000

env:
  encoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
  decoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
