# @package _global_
defaults:
  - /algorithm/dreamer: 200m
  - override /algorithm: dreamer
  - override /environment: alien
  - override /logger: wandb_dreamer
  - _self_

trainer:
  accelerator: gpu
  devices: [1]
  seed: 42
  total_frames: 1e5 # 100k agent steps = 400k game frames (action_repeat=4)
  num_envs: 1
  log_every_n_steps: 1000

env:
  encoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
  decoder:
    mlp_keys: '$^'
    cnn_keys: 'image'
