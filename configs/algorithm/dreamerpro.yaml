defaults:
  - dreamer        # inherits all fields from dreamer.yaml
  - _self_         # then apply overrides below

# DreamerPro: augmentation + EMA targets + Sinkhorn prototype assignment.
# swav = observation-level prototype loss, temp = feature-level prototype loss.
# norm regularises the projection norms toward 1.
dreamer_config:
  _target_: src.algorithms.dreamer.model.DreamerPro
  dreamer_pro:
    warm_up: 1
    num_prototypes: 2500
    proto_dim: 32
    temperature: 0.1
    sinkhorn_eps: 0.05
    sinkhorn_iters: 3
    ema_update_every: 1
    ema_update_fraction: 0.05
    freeze_prototypes_iters: 10000
    aug:
      max_delta: 3.0
      same_across_time: True
      bilinear: True
  loss_scales:
    recon: 0.0     # no decoder
    rew: 1.0
    con: 1.0
    dyn: 1.0
    rep: 0.1
    policy: 1.0
    value: 1.0
    repval: 0.3
    barlow: 0.0
    infonce: 0.0
    swav: 1.0      # SwAV prototype loss (obs view)
    temp: 1.0      # temporal prototype loss (feat view)
    norm: 0.01     # projection norm regularisation
