# Discrete SAC-BBF: BBF plus a stochastic policy head and entropy bonus.
_target_: src.algorithms.sac_bbf.SACBBFAlgorithm

obs_key: pixels

width_scale: 4
hidden_dim: 2048
num_atoms: 51
v_min: -10.0
v_max: 10.0
renormalize_latent: true

lr: 1.0e-4
policy_lr: 1.0e-4
alpha_lr: 1.0e-3
weight_decay: 0.1
adam_eps: 1.5e-4
batch_size: 32
max_grad_norm: 10.0

replay_ratio: 2
max_update_horizon: 10
min_update_horizon: 3
min_gamma: 0.97
max_gamma: 0.997
cycle_steps: 10_000
double_dqn: true
dueling: true

spr_weight: 5.0
spr_depth: 5

reset_interval: 40_000
shrink_factor: 0.5
perturb_factor: 0.5
no_resets_after: 100_000

target_tau: 0.005

replay_capacity: 200_000
prioritized: true
prb_alpha: 0.5
prb_beta: 0.5

data_augmentation: true
aug_pad: 4
intensity_scale: 0.05

eps_start: 1.0
eps_end: 0.0
eps_annealing_frames: 2_001
eps_eval: 0.001
min_replay_history: 2_000
frames_per_batch: 1
max_frames_per_traj: -1

entropy_decay_period: 80_000
entropy_initial_coef: 1.0e-2
entropy_final_coef: 0.0
