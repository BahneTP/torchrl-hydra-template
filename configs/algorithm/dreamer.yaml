_target_: src.algorithms.dreamer.dreamer.DreamerAlgorithm


# Wrapper Parameters (DreamerAlgorithm)
train_ratio: 128 # Divides Batch_Size * Batch_Length to determine the number of updates per data collection phase (how many frames till next update)
action_repeat: 4  # game frames per agent step; AtariPreprocessing(frame_skip=4) in atari_dreamer.yaml
device: ${trainer.accelerator}
agent_video_log_every: 50_000  # log agent gameplay video every N environment frames
agent_video_max_steps: 400      # cap video length (~20s at 20fps, continues across episode resets)

buffer_config:
  num_envs: ${trainer.num_envs}  # must match trainer.num_envs
  batch_size: 16
  batch_length: 64
  max_size: 5e6
  storage_device: cpu #! Keep Replay Buffer on CPU (Mabe use GPU on Kiel)
  device: ${trainer.accelerator}


# Inner Engine Parameters (Dreamer)
dreamer_config:
  act_entropy: 3e-4
  kl_free: 1.0
  imag_horizon: 15
  horizon: 333
  lamb: 0.95
  compile: True
  log_grads: False
  device: ${trainer.accelerator}
  
  # r2dreamer: Barlow Twins (decoder-free). Use "dreamer" for standard DreamerV3 reconstruction.
  rep_loss: "dreamer"

  lr: 4e-5
  agc: 0.3
  pmin: 1e-3
  eps: 1e-20
  beta1: 0.9
  beta2: 0.999
  warmup: 1000
  slow_target_update: 1
  slow_target_fraction: 0.02

  # Loss scales from R2Dreamer paper Table 2
  loss_scales:
    recon: 1.0     # unused in r2dreamer mode (no decoder)
    rew: 1.0
    con: 1.0
    dyn: 1.0       # βdyn=1 per paper (was 0.5)
    rep: 0.1
    policy: 1.0
    value: 1.0
    repval: 0.3
    barlow: 0.05   # βBT=0.05 per paper (was 0.0)
    infonce: 0.0
    swav: 0.0
    temp: 0.0
    norm: 0.0
    
  # Unused configurations maintained for structural integrity 
  r2dreamer:
    lambd: 5e-4
    
  dreamer_pro:
    warm_up: 1
    num_prototypes: 2500
    proto_dim: 32
    temperature: 0.1
    sinkhorn_eps: 0.05
    sinkhorn_iters: 3
    ema_update_every: 1
    ema_update_fraction: 0.05
    freeze_prototypes_iters: 10000
    aug:
      max_delta: 3.0
      same_across_time: True
      bilinear: True

  rssm:
    stoch: 32
    deter: ${model.deter}
    hidden: ${model.hidden}
    discrete: ${model.discrete}
    img_layers: 2
    obs_layers: 1
    dyn_layers: 1
    blocks: 8
    act: ${model.act}
    norm: ${model.norm}
    unimix_ratio: 0.01
    initial: 'learned'
    device: ${trainer.accelerator}
    
  encoder:
    mlp_keys: ${env.encoder.mlp_keys}
    cnn_keys: ${env.encoder.cnn_keys}
    mlp:
      shape: null
      layers: 3
      units: ${model.units}
      act: ${model.act}
      norm: ${model.norm}
      device: ${trainer.accelerator}
      outscale: null
      symlog_inputs: True
      name: 'mlp_encoder'
    cnn:
      act: ${model.act}
      norm: ${model.norm}
      kernel_size: 5
      minres: 4
      depth: ${model.depth}
      mults: [2, 3, 4, 4]
      
  decoder:
    mlp_keys: ${env.decoder.mlp_keys}
    cnn_keys: ${env.decoder.cnn_keys}
    mlp_dist:
      name: 'symlog_mse'
    cnn_dist:
      name: 'mse'
    mlp:
      shape: null
      layers: 3
      units: ${model.units}
      act: ${model.act}
      norm: ${model.norm}
      dist:
        name: 'identity'
      device: ${trainer.accelerator}
      outscale: 1.0
      symlog_inputs: False
      name: 'mlp_decoder'
    cnn:
      depth: ${model.depth}
      units: ${model.units}
      bspace: 8
      mults: [2, 3, 4, 4]
      act: ${model.act}
      norm: ${model.norm}
      kernel_size: 5
      minres: 4
      outscale: 1.0
      
  reward:
    shape: [255,]
    layers: 1
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    dist:
      name: 'symexp_twohot'
      bin_num: 255
    outscale: 0.0
    device: ${trainer.accelerator}
    symlog_inputs: False
    name: 'reward'
    
  cont:
    shape: [1,]
    layers: 1
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    dist:
      name: 'binary'
    outscale: 1.0
    device: ${trainer.accelerator}
    symlog_inputs: False
    name: 'cont'
    
  actor:
    shape: null
    layers: 3
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    device: ${trainer.accelerator}
    dist:
      cont:
        name: 'bounded_normal'
        min_std: 0.1
        max_std: 1.0
      disc:
        name: 'onehot'
        unimix_ratio: 0.01
      multi_disc:
        name: 'multi_onehot'
        unimix_ratio: 0.01
    outscale: 0.01
    symlog_inputs: False
    name: 'actor'
    
  critic:
    shape: [255,]
    layers: 3
    units: ${model.units}
    act: ${model.act}
    norm: ${model.norm}
    device: ${trainer.accelerator}
    dist:
      name: 'symexp_twohot'
      bin_num: 255
    outscale: 0.0
    symlog_inputs: False
    name: 'value'