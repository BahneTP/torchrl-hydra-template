defaults:
  - dreamer        # inherits all fields from dreamer.yaml
  - _self_         # then apply overrides below

# R2Dreamer: Barlow Twins latent-embedding alignment, no reconstruction decoder.
# To combine with reconstruction: set recon > 0 (decoder will be built automatically).
# To use InfoNCE instead of BT: set barlow: 0, infonce: 1.0.
dreamer_config:
  _target_: src.algorithms.dreamer.model.R2Dreamer
  r2dreamer:
    lambd: 5e-4   # off-diagonal redundancy weight in Barlow Twins loss
  loss_scales:
    recon: 0.0     # no decoder
    rew: 1.0
    con: 1.0
    dyn: 1.0
    rep: 0.1
    policy: 1.0
    value: 1.0
    repval: 0.3
    barlow: 0.05   # βBT=0.05 per R2Dreamer paper Table 2
    infonce: 0.0
    swav: 0.0
    temp: 0.0
    norm: 0.0
