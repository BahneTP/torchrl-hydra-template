defaults:
  - policy: nature_cnn_categorical
  - _self_

_target_: src.algorithms.ppo.PPOAlgorithm

# PPO on Atari pixels: shared Nature-CNN trunk + policy/value heads
# (cleanRL's ppo_atari.py agent), tuned for the Atari-100k budget.
obs_key: pixels

# Optimisation — cleanRL ppo_atari.py values except num_epochs: 10 (up from
# 4) for more sample reuse at the 100k-step budget (only ~97 rollouts).
lr: 2.5e-4
adam_eps: 1.0e-5
anneal_lr: true
anneal_frames: ${trainer.total_frames}  # lr reaches 0 at the end of training
gamma: 0.99
gae_lambda: 0.95
num_epochs: 10
mini_batch_size: 256
clip_epsilon: 0.1
clip_value: true          # cleanRL clip_vloss
entropy_coeff: 0.01
critic_coeff: 0.25        # == cleanRL 0.5 (MSE halving) * 0.5 (vf_coef)
loss_critic_type: l2
normalize_advantage: true # per minibatch
max_grad_norm: 0.5
target_kl: null

# Data collection: 8 envs x 128 steps (set trainer.num_envs: 8)
frames_per_batch: 1024
max_frames_per_traj: -1
