_target_: src.algorithms.ppo.PPOAlgorithm

# Defaults mirror cleanRL's ppo_continuous_action.py (MuJoCo/DMC, 1M frames).
# Callable factories (override via nested configs; requires ``instantiate(cfg.algorithm)``).
actor_network:
  _partial_: true
  _target_: src.components.networks.make_normal_mlp_actor
  num_cells: [64, 64]
  # `torch.nn.Tanh` via `_target_` would instantiate a module; MLP needs the class.
  activation_class:
    _target_: hydra.utils.get_class
    path: torch.nn.Tanh

value_network:
  _partial_: true
  _target_: src.components.networks.make_mlp_value
  num_cells: [64, 64]
  activation_class:
    _target_: hydra.utils.get_class
    path: torch.nn.Tanh

# Optimisation
lr: 3.0e-4
adam_eps: 1.0e-5
anneal_lr: true
anneal_frames: 1_000_000  # keep equal to trainer.total_frames (lr reaches 0 at the end)
gamma: 0.99
gae_lambda: 0.95
num_epochs: 10
mini_batch_size: 64
clip_epsilon: 0.2
clip_value: true          # cleanRL clip_vloss
entropy_coeff: 0.0
critic_coeff: 0.25        # == cleanRL 0.5 (MSE halving) * 0.5 (vf_coef)
loss_critic_type: l2
normalize_advantage: true # per minibatch
max_grad_norm: 0.5
target_kl: null

# Data collection (on-policy: no replay buffer, no warm-up)
frames_per_batch: 2048
max_frames_per_traj: -1
