name: ALE/${atari.game}-v5
gym_backend: gymnasium
gym_kwargs:
  frameskip: 1
  repeat_action_probability: 0.0
  disable_env_checker: true
  from_pixels: true
  pixels_only: false
  categorical_action_encoding: false

# Max-and-skip must sit inside EpisodicLifeEnv so life loss is checked after
# each aggregated agent step (not on every raw ALE frame). Soft reset then
# issues one NOOP through max-and-skip before the TorchRL transform stack.
gymnasium_wrappers:
  - _target_: src.environments.atari_wrappers.MaxAndSkipEnv
    skip: 4
  - _target_: src.environments.atari_wrappers.EpisodicLifeEnv

# Atari 100K preprocessing uses TorchRL random no-ops, 84x84 grayscale frames
# stacked 4 deep (CatFrames, same pattern as pong_train.yaml), and training
# rewards clipped to {-1, 0, 1} (SignTransform, placed after RewardSum so
# logged episode returns stay unclipped).
transforms:
  - _target_: torchrl.envs.NoopResetEnv
    noops: 30
    random: true
  - _target_: torchrl.envs.ToTensorImage
  - _target_: torchrl.envs.GrayScale
  - _target_: torchrl.envs.Resize
    w: 84
    h: 84
  - _target_: torchrl.envs.CatFrames
    N: 4
    dim: -3
  - _target_: torchrl.envs.RewardSum
  - _target_: torchrl.envs.SignTransform
    in_keys: [reward]
  - _target_: torchrl.envs.StepCounter
    max_steps: 27000
