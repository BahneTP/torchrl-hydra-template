# Shared base for Dreamer Atari100k Benchmark

#
# Note: the InitTracker + RenameTransforms are Dreamer-specific (is_first, image
# key names)
benchmark: atari100k
name: ???
gym_backend: gymnasium
gym_kwargs:
  from_pixels: true
  pixels_only: false
  frame_skip: 1                   # frameskip=1 required by AtariPreprocessing
  repeat_action_probability: 0.0  # sticky=False (matches R2Dreamer default)
  full_action_space: false        # minimal action set

gymnasium_wrappers:
  - _target_: gymnasium.wrappers.AtariPreprocessing
    noop_max: 0                   # NoopResetEnv below handles noops
    frame_skip: 4                 # action_repeat=4 with max-pool of last 2 frames
    screen_size: 64               # resize to 64x64 (replaces Resize transform)
    grayscale_obs: false          # keep RGB for DreamerV3
    terminal_on_life_loss: false
    scale_obs: false              # keep uint8; ToTensorImage normalises to [0,1]

transforms:
  - _target_: torchrl.envs.NoopResetEnv
    noops: 30
    random: true

  - _target_: torchrl.envs.InitTracker
  - _target_: torchrl.envs.RenameTransform
    in_keys: ["is_init"]
    out_keys: ["is_first"]

  - _target_: torchrl.envs.ToTensorImage

  - _target_: torchrl.envs.RenameTransform
    in_keys: ["pixels"]
    out_keys: ["image"]

  - _target_: torchrl.envs.StepCounter
    max_steps: 27000              # 108000 ALE frames / action_repeat=4

  - _target_: torchrl.envs.RewardSum

  - _target_: torchrl.envs.DoubleToFloat
