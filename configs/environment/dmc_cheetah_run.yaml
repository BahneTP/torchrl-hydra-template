backend: dm_control
name: cheetah
task: run
transforms:
  # Action repeat 2 (rewards summed) -> 500 decision steps per 1000-sim-step episode,
  # matching TD-MPC2's DMC setup (github.com/nicklashansen/tdmpc2, envs/dmcontrol.py).
  - _target_: torchrl.envs.transforms.FrameSkipTransform
    frame_skip: 2
  # Flatten the dm_control obs dict (position: 8, velocity: 9) into a single
  # 17-dim "observation" vector (alphabetical order = upstream's dict order).
  - _target_: torchrl.envs.transforms.CatTensors
    in_keys: [position, velocity]
    out_key: observation
  - _target_: torchrl.envs.transforms.DoubleToFloat
  - _target_: torchrl.envs.transforms.InitTracker
  - _target_: torchrl.envs.transforms.StepCounter
  - _target_: torchrl.envs.transforms.RewardSum
