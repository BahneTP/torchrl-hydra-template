defaults:
  - _self_
  - paths: default
  - trainer: default
  - algorithm: ???
  - environment: ???
  - environment@eval_environment: null   # optional eval env; falls back to environment
  - logger: tensorboard
  - experiment: null
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

# Display name for the run (W&B). ``oc.select`` keeps this resolvable for env
# configs without a ``task`` key. Experiments may override it.
run_name: ${hydra:runtime.choices.algorithm}_${oc.select:environment.task,unknown}_${now:%Y-%m-%d_%H-%M-%S}

checkpoint:
  enabled: true
  save_dir: ${paths.output_dir}/checkpoints
  save_every_n_steps: 0   # periodic saves every N env steps (0 disables)
  save_last: true         # always write checkpoints/last.pt at train end
  resume_from: null       # path to .pt file to resume from

hydra:
  run:
    dir: ${paths.log_dir}/train/runs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${paths.log_dir}/train/multiruns/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
